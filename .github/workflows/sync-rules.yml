name: Sync rule snapshots

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rule-snapshots
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Synchronize upstream rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/sync_rules.py sync

      - name: Validate snapshots
        run: uv run --frozen python scripts/sync_rules.py validate

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- rules checksums.sha256; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshots
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules checksums.sha256
          git commit -m "chore(rules): sync upstream snapshots"
          git push origin HEAD:main
